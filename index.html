<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gewohnheits-Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f6ff;
      color: #1e293b;
      min-height: 100vh;
      padding: 1.5rem 1rem 4rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .top-bar h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1d4ed8;
    }

    /* View tabs */
    .view-tabs {
      display: flex;
      background: #fff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      overflow: hidden;
    }

    .view-tabs button {
      border: none;
      background: none;
      padding: 0.5rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.18s;
    }

    .view-tabs button.active {
      background: #2563eb;
      color: #fff;
    }

    .view-tabs button:not(.active):hover { background: #eff6ff; color: #1d4ed8; }

    /* ── Period navigation ── */
    .period-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .period-nav button {
      background: #fff;
      border: 2px solid #bfdbfe;
      color: #2563eb;
      font-size: 1.2rem;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .period-nav button:hover { background: #eff6ff; }

    .period-nav .label {
      font-weight: 700;
      font-size: 1.05rem;
      color: #1e293b;
      min-width: 16rem;
      text-align: center;
    }

    /* ── Add form ── */
    .add-form {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.1rem;
    }

    .add-form input {
      flex: 1;
      padding: 0.65rem 1rem;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus { border-color: #2563eb; }
    .add-form input::placeholder { color: #94a3b8; }

    .add-form button {
      padding: 0.65rem 1.2rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .add-form button:hover { background: #1d4ed8; }

    /* ── Summary chips ── */
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 1.1rem;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .chip .chip-name { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip .chip-stats { opacity: 0.85; font-weight: 700; }

    /* ── Tracker table ── */
    .tracker-wrap {
      background: #fff;
      border: 2px solid #e2eafe;
      border-radius: 16px;
      overflow: hidden;
    }

    .tracker-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tracker-scroll::-webkit-scrollbar { height: 5px; }
    .tracker-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
    .tracker-scroll::-webkit-scrollbar-thumb { background: #bfdbfe; border-radius: 3px; }

    table { width: 100%; border-collapse: collapse; }

    /* Head */
    thead th {
      padding: 0.55rem 0.2rem;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      background: #f8faff;
      border-bottom: 2px solid #e2eafe;
      text-align: center;
      white-space: nowrap;
    }

    thead th.th-name {
      text-align: left;
      padding-left: 1rem;
      min-width: 160px;
    }

    thead th.th-stats { color: #2563eb; min-width: 70px; }
    thead th.today-col { background: #eff6ff; color: #2563eb !important; }

    /* Body rows */
    tbody tr { border-bottom: 1px solid #f1f5f9; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafcff; }

    /* Name cell */
    td.td-name {
      padding: 0.65rem 0.5rem 0.65rem 1rem;
      min-width: 160px;
    }

    .habit-label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .color-bar {
      width: 5px;
      height: 1.8rem;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .habit-name-text {
      font-weight: 600;
      font-size: 0.88rem;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 110px;
    }

    .del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 0.8rem;
      padding: 0.15rem 0.3rem;
      border-radius: 5px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .del-btn:hover { color: #ef4444; background: #fef2f2; }

    /* Day cells (week/month view) */
    td.td-day {
      text-align: center;
      padding: 0.2rem 0.1rem;
      min-width: 30px;
    }

    td.td-day.today-col { background: #eff6ff; }

    .day-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 2px solid #e2e8f0;
      background: #fff;
      cursor: pointer;
      transition: all 0.14s;
      position: relative;
      display: inline-block;
    }

    .day-btn:hover:not(:disabled) {
      border-color: #93c5fd;
      background: #eff6ff;
      transform: scale(1.12);
    }

    .day-btn:disabled { opacity: 0.28; cursor: default; }
    .day-btn.today-ring { border-color: #2563eb; border-width: 2px; }

    .day-btn.checked {
      border-color: transparent;
    }

    .day-btn.checked::after {
      content: '✓';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: #fff;
      line-height: 24px;
      text-align: center;
    }

    /* Stats cell (week/month) */
    td.td-stats {
      text-align: center;
      padding: 0.4rem 0.6rem;
      min-width: 70px;
    }

    .stats-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .stats-count {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
      white-space: nowrap;
    }

    .stats-pct {
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748b;
    }

    /* ── Yearly view cells ── */
    td.td-year {
      text-align: center;
      padding: 0.3rem 0.2rem;
      min-width: 58px;
    }

    .year-cell {
      border-radius: 8px;
      padding: 0.4rem 0.2rem;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      transition: transform 0.12s;
      cursor: default;
    }

    .year-cell:hover { transform: scale(1.05); }

    .year-cell .yc-pct {
      font-size: 0.82rem;
      font-weight: 700;
    }

    .year-cell .yc-count {
      font-size: 0.66rem;
      font-weight: 500;
    }

    .year-cell.future {
      background: #f1f5f9 !important;
      color: #cbd5e1;
    }

    /* Empty */
    .empty-td {
      padding: 3rem;
      text-align: center;
      color: #94a3b8;
    }

    .empty-icon { font-size: 2.5rem; margin-bottom: 0.4rem; }
  </style>
</head>
<body>
<div class="container">

  <!-- Top bar -->
  <div class="top-bar">
    <h1>Gewohnheits-Tracker</h1>
    <div class="view-tabs" id="view-tabs">
      <button data-view="week">Woche</button>
      <button data-view="month" class="active">Monat</button>
      <button data-view="year">Jahr</button>
    </div>
  </div>

  <!-- Period navigation -->
  <div class="period-nav">
    <button id="prev">&#8249;</button>
    <span class="label" id="period-label"></span>
    <button id="next">&#8250;</button>
  </div>

  <!-- Add form -->
  <form class="add-form" id="add-form">
    <input type="text" id="habit-input" placeholder="Neue Aktivität hinzufügen ..." maxlength="40" autocomplete="off" />
    <button type="submit">+ Hinzufügen</button>
  </form>

  <!-- Summary chips -->
  <div class="summary" id="summary"></div>

  <!-- Table -->
  <div class="tracker-wrap">
    <div class="tracker-scroll">
      <table id="tracker">
        <thead id="t-head"></thead>
        <tbody id="t-body"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
// ── Constants ─────────────────────────────────────────
const PALETTE = [
  { bar:'#2563eb', chip:'#dbeafe', chipText:'#1d4ed8' },
  { bar:'#059669', chip:'#d1fae5', chipText:'#047857' },
  { bar:'#d97706', chip:'#fef3c7', chipText:'#b45309' },
  { bar:'#7c3aed', chip:'#ede9fe', chipText:'#6d28d9' },
  { bar:'#dc2626', chip:'#fee2e2', chipText:'#b91c1c' },
  { bar:'#0891b2', chip:'#cffafe', chipText:'#0e7490' },
  { bar:'#ea580c', chip:'#ffedd5', chipText:'#c2410c' },
  { bar:'#db2777', chip:'#fce7f3', chipText:'#be185d' },
];

const MONTHS = ['Januar','Februar','März','April','Mai','Juni',
                'Juli','August','September','Oktober','November','Dezember'];
const MONTHS_S = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DAYS_S   = ['Mo','Di','Mi','Do','Fr','Sa','So'];

// ── State ─────────────────────────────────────────────
const today = new Date(); today.setHours(0,0,0,0);
let viewMode = 'month';
let viewDate = new Date(today);

function loadData() {
  try { return JSON.parse(localStorage.getItem('ht3') || '{}'); } catch { return {}; }
}
function saveData(d) { localStorage.setItem('ht3', JSON.stringify(d)); }

let data = loadData();
if (!data.habits) data.habits = [];
if (!data.checks) data.checks = {};

// ── Helpers ───────────────────────────────────────────
function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
function daysInYear(y)      { return new Date(y, 1, 29).getMonth() === 1 ? 366 : 365; }

function colorOf(h) { return PALETTE[h.colorIndex % PALETTE.length]; }

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3),16),
    parseInt(hex.slice(3,5),16),
    parseInt(hex.slice(5,7),16)
  ];
}

function getMonthKey(y, m) {
  return `${y}-${String(m+1).padStart(2,'0')}`;
}

function getChecks(habitId, y, m) {
  const key = `${getMonthKey(y,m)}:${habitId}`;
  return new Set(data.checks[key] || []);
}

function toggleDay(habitId, y, m, d) {
  const key = `${getMonthKey(y,m)}:${habitId}`;
  const set = getChecks(habitId, y, m);
  const ds  = `${getMonthKey(y,m)}-${String(d).padStart(2,'0')}`;
  if (set.has(ds)) set.delete(ds); else set.add(ds);
  data.checks[key] = [...set];
  saveData(data);
  render();
}

// Monday of the week containing `viewDate`
function weekStart() {
  const d = new Date(viewDate);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  d.setHours(0,0,0,0);
  return d;
}

function formatDE(date) {
  return date.toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' });
}

function isDateFuture(date) { return date > today; }

// ── Stats helpers ──────────────────────────────────────
function weekStats(habitId) {
  const ws = weekStart();
  let done = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws); d.setDate(ws.getDate() + i);
    const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    const ds = `${getMonthKey(y,m)}-${String(day).padStart(2,'0')}`;
    if (getChecks(habitId, y, m).has(ds)) done++;
  }
  return { done, total: 7 };
}

function monthStats(habitId, y, m) {
  const done  = getChecks(habitId, y, m).size;
  const total = daysInMonth(y, m);
  return { done, total };
}

function yearStats(habitId, y) {
  let done = 0, total = daysInYear(y);
  for (let m = 0; m < 12; m++) done += getChecks(habitId, y, m).size;
  return { done, total };
}

function pct(done, total) {
  if (total === 0) return 0;
  return Math.round(done / total * 100);
}

// ── Main render ───────────────────────────────────────
function render() {
  renderTabs();
  renderPeriodLabel();
  renderSummary();
  renderTable();
}

function renderTabs() {
  document.querySelectorAll('.view-tabs button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === viewMode);
  });
}

function renderPeriodLabel() {
  const el = document.getElementById('period-label');
  if (viewMode === 'week') {
    const ws = weekStart();
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    const kw = getISOWeek(ws);
    el.textContent = `KW ${kw} · ${formatDE(ws)} – ${formatDE(we)} ${ws.getFullYear()}`;
  } else if (viewMode === 'month') {
    el.textContent = `${MONTHS[viewDate.getMonth()]} ${viewDate.getFullYear()}`;
  } else {
    el.textContent = `${viewDate.getFullYear()}`;
  }
}

function renderSummary() {
  const el = document.getElementById('summary');
  if (!data.habits.length) { el.innerHTML = ''; return; }

  el.innerHTML = data.habits.map(h => {
    const c = colorOf(h);
    let stats;
    if (viewMode === 'week')       stats = weekStats(h.id);
    else if (viewMode === 'month') stats = monthStats(h.id, viewDate.getFullYear(), viewDate.getMonth());
    else                           stats = yearStats(h.id, viewDate.getFullYear());

    const p = pct(stats.done, stats.total);
    return `<div class="chip" style="background:${c.chip};color:${c.chipText}">
      <div class="dot" style="background:${c.bar}"></div>
      <span class="chip-name">${h.name}</span>
      <span class="chip-stats">${stats.done}/${stats.total} · ${p}%</span>
    </div>`;
  }).join('');
}

function renderTable() {
  if (viewMode === 'week')       renderWeekly();
  else if (viewMode === 'month') renderMonthly();
  else                           renderYearly();
}

// ── Weekly view ───────────────────────────────────────
function renderWeekly() {
  const ws = weekStart();
  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(ws); d.setDate(ws.getDate() + i);
    return d;
  });

  // Head
  const th = days.map((d, i) => {
    const isToday = d.getTime() === today.getTime();
    return `<th class="${isToday ? 'today-col' : ''}">
      ${DAYS_S[i]}<br><small style="font-weight:400;font-size:0.62rem">${formatDE(d)}</small>
    </th>`;
  }).join('');
  document.getElementById('t-head').innerHTML =
    `<tr><th class="th-name">Aktivität</th>${th}<th class="th-stats">Ergebnis</th></tr>`;

  // Body
  if (!data.habits.length) { renderEmpty(9); return; }

  document.getElementById('t-body').innerHTML = data.habits.map(h => {
    const c = colorOf(h);
    const cells = days.map(d => {
      const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
      const ds = `${getMonthKey(y,m)}-${String(day).padStart(2,'0')}`;
      const checked  = getChecks(h.id, y, m).has(ds);
      const isToday  = d.getTime() === today.getTime();
      const isFuture = isDateFuture(d);

      let cls = 'day-btn';
      if (isToday)  cls += ' today-ring';
      if (checked)  cls += ' checked';
      const style = checked ? `background:${c.bar};` : isToday ? `border-color:${c.bar};` : '';

      return `<td class="td-day${isToday?' today-col':''}">
        <button class="${cls}" style="${style}"
          data-hid="${h.id}" data-y="${y}" data-m="${m}" data-d="${day}"
          ${isFuture ? 'disabled' : ''}></button>
      </td>`;
    }).join('');

    const s = weekStats(h.id);
    const p = pct(s.done, s.total);
    return `<tr>
      <td class="td-name"><div class="habit-label">
        <div class="color-bar" style="background:${c.bar}"></div>
        <span class="habit-name-text">${h.name}</span>
        <button class="del-btn" data-del="${h.id}">✕</button>
      </div></td>
      ${cells}
      <td class="td-stats"><div class="stats-box">
        <span class="stats-count" style="background:${c.chip};color:${c.chipText}">${s.done}/${s.total}</span>
        <span class="stats-pct">${p}%</span>
      </div></td>
    </tr>`;
  }).join('');

  bindEvents();
}

// ── Monthly view ──────────────────────────────────────
function renderMonthly() {
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  const total = daysInMonth(y, m);

  const th = Array.from({length:total}, (_,i) => {
    const d = new Date(y, m, i+1);
    const isToday = d.getTime() === today.getTime();
    return `<th class="${isToday?'today-col':''}" style="min-width:28px">${i+1}</th>`;
  }).join('');
  document.getElementById('t-head').innerHTML =
    `<tr><th class="th-name">Aktivität</th>${th}<th class="th-stats">Ergebnis</th></tr>`;

  if (!data.habits.length) { renderEmpty(total + 2); return; }

  document.getElementById('t-body').innerHTML = data.habits.map(h => {
    const c = colorOf(h);
    const checks = getChecks(h.id, y, m);

    const cells = Array.from({length:total}, (_,i) => {
      const day = i + 1;
      const d   = new Date(y, m, day);
      const ds  = `${getMonthKey(y,m)}-${String(day).padStart(2,'0')}`;
      const checked  = checks.has(ds);
      const isToday  = d.getTime() === today.getTime();
      const isFuture = isDateFuture(d);

      let cls = 'day-btn';
      if (isToday)  cls += ' today-ring';
      if (checked)  cls += ' checked';
      const style = checked ? `background:${c.bar};` : isToday ? `border-color:${c.bar};` : '';

      return `<td class="td-day${isToday?' today-col':''}">
        <button class="${cls}" style="${style}"
          data-hid="${h.id}" data-y="${y}" data-m="${m}" data-d="${day}"
          ${isFuture ? 'disabled' : ''}></button>
      </td>`;
    }).join('');

    const s = monthStats(h.id, y, m);
    const p = pct(s.done, s.total);
    return `<tr>
      <td class="td-name"><div class="habit-label">
        <div class="color-bar" style="background:${c.bar}"></div>
        <span class="habit-name-text">${h.name}</span>
        <button class="del-btn" data-del="${h.id}">✕</button>
      </div></td>
      ${cells}
      <td class="td-stats"><div class="stats-box">
        <span class="stats-count" style="background:${c.chip};color:${c.chipText}">${s.done}/${s.total}</span>
        <span class="stats-pct">${p}%</span>
      </div></td>
    </tr>`;
  }).join('');

  bindEvents();
}

// ── Yearly view ───────────────────────────────────────
function renderYearly() {
  const y = viewDate.getFullYear();
  const nowYear = today.getFullYear(), nowMonth = today.getMonth();

  const th = MONTHS_S.map(n => `<th style="min-width:58px">${n}</th>`).join('');
  document.getElementById('t-head').innerHTML =
    `<tr><th class="th-name">Aktivität</th>${th}<th class="th-stats">Jahr</th></tr>`;

  if (!data.habits.length) { renderEmpty(14); return; }

  document.getElementById('t-body').innerHTML = data.habits.map(h => {
    const c = colorOf(h);
    const [r, g, b] = hexToRgb(c.bar);

    const cells = Array.from({length:12}, (_,m) => {
      const isFuture = (y > nowYear) || (y === nowYear && m > nowMonth);
      const s  = monthStats(h.id, y, m);
      const p  = pct(s.done, s.total);
      const op = Math.min(p / 100 * 0.75, 0.75);

      if (isFuture) {
        return `<td class="td-year"><div class="year-cell future">
          <span class="yc-pct">–</span>
        </div></td>`;
      }

      const bg  = p > 0 ? `rgba(${r},${g},${b},${op})` : '#f1f5f9';
      const txt = p > 0 ? c.chipText : '#94a3b8';

      return `<td class="td-year"><div class="year-cell" style="background:${bg};color:${txt}"
        title="${MONTHS[m]}: ${s.done}/${s.total} Tage (${p}%)">
        <span class="yc-pct">${p}%</span>
        <span class="yc-count">${s.done}/${s.total}</span>
      </div></td>`;
    }).join('');

    const ys = yearStats(h.id, y);
    const yp = pct(ys.done, ys.total);
    return `<tr>
      <td class="td-name"><div class="habit-label">
        <div class="color-bar" style="background:${c.bar}"></div>
        <span class="habit-name-text">${h.name}</span>
        <button class="del-btn" data-del="${h.id}">✕</button>
      </div></td>
      ${cells}
      <td class="td-stats"><div class="stats-box">
        <span class="stats-count" style="background:${c.chip};color:${c.chipText}">${ys.done}/${ys.total}</span>
        <span class="stats-pct">${yp}%</span>
      </div></td>
    </tr>`;
  }).join('');

  bindEvents();
}

// ── Empty state ───────────────────────────────────────
function renderEmpty(cols) {
  document.getElementById('t-body').innerHTML = `<tr>
    <td class="empty-td" colspan="${cols}">
      <div class="empty-icon">📋</div>
      Noch keine Aktivitäten — füge deine erste oben hinzu!
    </td>
  </tr>`;
}

// ── Event binding ─────────────────────────────────────
function bindEvents() {
  document.querySelectorAll('.day-btn:not(:disabled)').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleDay(btn.dataset.hid,
        Number(btn.dataset.y), Number(btn.dataset.m), Number(btn.dataset.d));
    });
  });
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const h = data.habits.find(x => x.id === btn.dataset.del);
      if (h && confirm(`"${h.name}" wirklich löschen?`)) {
        data.habits = data.habits.filter(x => x.id !== h.id);
        saveData(data);
        render();
      }
    });
  });
}

// ── Navigation ────────────────────────────────────────
document.getElementById('prev').addEventListener('click', () => {
  if (viewMode === 'week')       viewDate.setDate(viewDate.getDate() - 7);
  else if (viewMode === 'month') viewDate.setMonth(viewDate.getMonth() - 1);
  else                           viewDate.setFullYear(viewDate.getFullYear() - 1);
  render();
});

document.getElementById('next').addEventListener('click', () => {
  if (viewMode === 'week')       viewDate.setDate(viewDate.getDate() + 7);
  else if (viewMode === 'month') viewDate.setMonth(viewDate.getMonth() + 1);
  else                           viewDate.setFullYear(viewDate.getFullYear() + 1);
  render();
});

document.querySelectorAll('.view-tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    viewMode = btn.dataset.view;
    viewDate = new Date(today);
    render();
  });
});

// ── Add habit ─────────────────────────────────────────
document.getElementById('add-form').addEventListener('submit', e => {
  e.preventDefault();
  const inp  = document.getElementById('habit-input');
  const name = inp.value.trim();
  if (!name) return;
  data.habits.push({ id: Date.now().toString(), name, colorIndex: data.habits.length });
  saveData(data);
  inp.value = '';
  render();
});

// ── ISO week helper ───────────────────────────────────
function getISOWeek(date) {
  const d = new Date(date);
  d.setDate(d.getDate() + 4 - (d.getDay() || 7));
  return Math.ceil(((d - new Date(d.getFullYear(),0,1)) / 86400000 + 1) / 7);
}

render();
</script>
</body>
</html>

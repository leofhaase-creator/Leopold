<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gewohnheits-Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f6ff;
      color: #1e293b;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1d4ed8;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 0.4rem;
      color: #64748b;
      font-size: 0.95rem;
    }

    /* Add habit form */
    .add-form {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .add-form input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      font-size: 1rem;
      background: #fff;
      color: #1e293b;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input:focus {
      border-color: #2563eb;
    }

    .add-form input::placeholder {
      color: #94a3b8;
    }

    .add-form button {
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .add-form button:hover { background: #1d4ed8; }
    .add-form button:active { transform: scale(0.97); }

    /* Week header */
    .week-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #2563eb;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .days-header {
      display: grid;
      grid-template-columns: 1fr repeat(7, 2.5rem) 4.5rem 2rem;
      gap: 0.25rem;
      padding: 0 1rem 0.4rem;
      align-items: center;
    }

    .days-header span {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .days-header span:first-child { text-align: left; }

    /* Habit cards */
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .habit-card {
      background: #fff;
      border: 2px solid #e2eafe;
      border-radius: 14px;
      padding: 0.85rem 1rem;
      display: grid;
      grid-template-columns: 1fr repeat(7, 2.5rem) 4.5rem 2rem;
      gap: 0.25rem;
      align-items: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .habit-card:hover {
      border-color: #93c5fd;
      box-shadow: 0 2px 12px rgba(37, 99, 235, 0.08);
    }

    .habit-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1e293b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 0.5rem;
    }

    /* Day checkboxes */
    .day-cell {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .day-cell input[type="checkbox"] {
      appearance: none;
      width: 1.6rem;
      height: 1.6rem;
      border: 2px solid #bfdbfe;
      border-radius: 7px;
      background: #f8faff;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .day-cell input[type="checkbox"]:checked {
      background: #2563eb;
      border-color: #2563eb;
    }

    .day-cell input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 6px;
      height: 10px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .day-cell input[type="checkbox"].today {
      border-color: #2563eb;
    }

    /* Count badge */
    .count-badge {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: #fff;
      background: #2563eb;
      border-radius: 20px;
      padding: 0.2rem 0.5rem;
    }

    .count-badge.zero {
      background: #e2e8f0;
      color: #94a3b8;
    }

    /* Delete button */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 1.1rem;
      padding: 0.2rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fef2f2;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 0.75rem;
    }

    .empty-state p {
      font-size: 1rem;
    }

    /* Today highlight in header */
    .days-header span.today-col {
      color: #2563eb;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .days-header { grid-template-columns: 1fr repeat(7, 1.9rem) 3.5rem 1.8rem; padding: 0 0.5rem 0.4rem; }
      .habit-card { grid-template-columns: 1fr repeat(7, 1.9rem) 3.5rem 1.8rem; padding: 0.75rem 0.5rem; }
      .day-cell input[type="checkbox"] { width: 1.4rem; height: 1.4rem; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gewohnheits-Tracker</h1>
      <p id="week-info"></p>
    </header>

    <form class="add-form" id="add-form">
      <input type="text" id="habit-input" placeholder="Neue Gewohnheit hinzufügen..." maxlength="50" autocomplete="off" />
      <button type="submit">+ Hinzufügen</button>
    </form>

    <div class="week-label" id="week-label"></div>
    <div class="days-header" id="days-header"></div>
    <div class="habits-list" id="habits-list"></div>
  </div>

  <script>
    const DAYS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

    // Get the Monday of the current week
    function getMondayOfWeek(date) {
      const d = new Date(date);
      const day = d.getDay(); // 0=Sun,1=Mon,...
      const diff = (day === 0 ? -6 : 1 - day);
      d.setDate(d.getDate() + diff);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function getWeekKey(monday) {
      return monday.toISOString().slice(0, 10);
    }

    function formatDate(date) {
      return date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const monday = getMondayOfWeek(today);
    const weekKey = getWeekKey(monday);

    // Days of this week as date strings
    const weekDays = Array.from({ length: 7 }, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return d.toISOString().slice(0, 10);
    });

    const todayStr = today.toISOString().slice(0, 10);
    const todayIndex = weekDays.indexOf(todayStr);

    // Storage helpers
    function loadData() {
      try { return JSON.parse(localStorage.getItem('habitTracker') || '{}'); } catch { return {}; }
    }

    function saveData(data) {
      localStorage.setItem('habitTracker', JSON.stringify(data));
    }

    let data = loadData();
    if (!data.habits) data.habits = [];
    if (!data.checks) data.checks = {};

    // Render week header
    function renderHeader() {
      const sunday = weekDays[6];
      document.getElementById('week-info').textContent =
        `KW ${getISOWeek(monday)} · ${formatDate(monday)} – ${formatDate(new Date(sunday))}`;

      document.getElementById('week-label').textContent =
        `Woche ${formatDate(monday)} – ${formatDate(new Date(sunday))}`;

      const header = document.getElementById('days-header');
      header.innerHTML = '<span>Gewohnheit</span>' +
        DAYS.map((d, i) =>
          `<span class="${i === todayIndex ? 'today-col' : ''}">${d}<br><small style="font-weight:400;font-size:0.65rem">${formatDate(new Date(weekDays[i]))}</small></span>`
        ).join('') +
        '<span style="text-align:center">Woche</span><span></span>';
    }

    // Render habits
    function renderHabits() {
      const list = document.getElementById('habits-list');

      if (data.habits.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="icon">📋</div>
            <p>Noch keine Gewohnheiten. Füge deine erste hinzu!</p>
          </div>`;
        return;
      }

      list.innerHTML = data.habits.map((habit, idx) => {
        const checkKey = `${weekKey}:${habit.id}`;
        const checks = data.checks[checkKey] || [];
        const count = checks.length;

        const dayBoxes = weekDays.map((dayStr, i) => {
          const checked = checks.includes(dayStr);
          const isToday = dayStr === todayStr;
          const isFuture = dayStr > todayStr;
          return `
            <div class="day-cell">
              <input type="checkbox"
                data-habit="${habit.id}"
                data-day="${dayStr}"
                ${checked ? 'checked' : ''}
                ${isFuture ? 'disabled' : ''}
                class="${isToday ? 'today' : ''}"
                title="${DAYS[i]}, ${formatDate(new Date(dayStr))}"
              />
            </div>`;
        }).join('');

        return `
          <div class="habit-card" data-id="${habit.id}">
            <div class="habit-name" title="${habit.name}">${habit.name}</div>
            ${dayBoxes}
            <div class="count-badge ${count === 0 ? 'zero' : ''}">${count}/7</div>
            <button class="delete-btn" data-delete="${habit.id}" title="Löschen">✕</button>
          </div>`;
      }).join('');

      // Checkbox events
      list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', () => {
          const id = cb.dataset.habit;
          const day = cb.dataset.day;
          const checkKey = `${weekKey}:${id}`;
          if (!data.checks[checkKey]) data.checks[checkKey] = [];

          if (cb.checked) {
            if (!data.checks[checkKey].includes(day)) data.checks[checkKey].push(day);
          } else {
            data.checks[checkKey] = data.checks[checkKey].filter(d => d !== day);
          }
          saveData(data);
          renderHabits();
        });
      });

      // Delete events
      list.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.delete;
          if (confirm('Gewohnheit wirklich löschen?')) {
            data.habits = data.habits.filter(h => h.id !== id);
            saveData(data);
            renderHabits();
          }
        });
      });
    }

    // Add habit
    document.getElementById('add-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('habit-input');
      const name = input.value.trim();
      if (!name) return;

      data.habits.push({ id: Date.now().toString(), name });
      saveData(data);
      input.value = '';
      renderHabits();
    });

    // ISO week number helper
    function getISOWeek(date) {
      const d = new Date(date);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 4 - (d.getDay() || 7));
      const yearStart = new Date(d.getFullYear(), 0, 1);
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    renderHeader();
    renderHabits();
  </script>
</body>
</html>
